<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eneas Junior | Select Language</title>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Estilos exclusivos para a tela de entrada centralizada */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background-color: var(--bg-color);
      padding: 20px;
    }
    
    .splash-title {
      font-size: 3.5rem;
      margin-bottom: 10px;
      color: var(--text-primary);
      letter-spacing: -1px;
    }
    
    .splash-subtitle {
      color: var(--text-secondary);
      font-size: 1.2rem;
      margin-bottom: 50px;
    }
    
    .lang-buttons-wrapper {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .lang-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 120px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 2px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-primary);
    }
    
    .lang-btn span.flag {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    .lang-btn span.text {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .lang-btn:hover {
      border-color: var(--accent-color);
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.15);
      background: rgba(15, 23, 42, 0.8);
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <h1 class="splash-title">Eneas Junior</h1>
    <p class="splash-subtitle">Machine Learning Engineer & Data Scientist</p>

    <div class="lang-buttons-wrapper">
      <a href="home.html" class="lang-btn">
        <span class="flag">🇧🇷</span>
        <span class="text">Português</span>
      </a>

      <a href="home-en.html" class="lang-btn">
        <span class="flag">🇺🇸</span>
        <span class="text">English</span>
      </a>
    </div>
  </div>

</body>
</html>
